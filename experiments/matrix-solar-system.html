<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Solar System</title>
    <style>
        * {margin: 0; padding: 0;}
        body {background-color: grey;}
        canvas {background-color: black;}
        div#controls {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid #3ff393;
            bottom: 8px;
            left: 8px;
            color: #3ff393;
            padding: 16px;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="controls">
        <span>Controls:</span><br><br>

        <b>Time speed: </b><span id="_fps">1</span><br>
        <input type="range" name="fps" id="fps" min="0" max="100" value="1"><br>

        <b>Particle count: </b><span id="np">100</span><br>
        <input type="range" name="particle-count" id="particle-count" max="10000" value="100"><br>
        
        <b>Gravity: </b><span id="g">0</span><br>
        <input type="range" name="gravity" id="gravity" max="1000000"><br>

        <input type="button" value="reset" onclick="Sim.reset();">
    </div>
    <script>
        let running = true;

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        let dtime = 1;
        let c = [0, 0, 0];
        let v = [];
        let vh = 600;
        let G = 100;
        let particleCount = 100;
        let timeMultiplier = 1;
        const eps = 10;

        const controls = document.getElementById("controls");

        const Sim = {
            FPS: 10,

            maxParticles: particleCount,
            particleSize: 20,
            particles: [],


            matrixColor: "rgb(63, 243, 147)",
            characters: "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンあいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん",

            field: function(p) {
                const v0 = 100;

                const rx = p[0] - c[0];
                const ry = p[1] - c[1];
                const rz = p[2] - c[2];

                const ax = 0;
                const ay = -Math.cos(Math.PI / 6);
                const az = Math.sin(Math.PI / 6);

                const tx = ay * rz - az * ry;
                const ty = az * rx - ax * rz;
                const tz = ax * ry - ay * rx;

                const t = Math.hypot(tx, ty, tz);

                if (t === 0) return [0, 0, 0];

                return [
                    v0 * tx / t,
                    v0 * ty / t,
                    v0 * tz / t,
                ];
            },

            initParticles: function() {
                for (let i = 0; i < Sim.maxParticles; i++) {
                    let x = Math.floor(100 + Math.random() * 1000) * Math.sign(Math.random() - 0.5);
                    let y = Math.floor((Math.random() - 0.5) * 0);
                    let z = Math.floor((Math.random() - 0.5) * 0);

                    let dist_c = Math.sqrt(Math.pow(x, 2) + Math.pow(y, 2) + Math.pow(z, 2));
                    let v0 = Math.sqrt(G / dist_c);
                    let t = Math.atan(y / x);
                    let phi = Math.PI / 6;

                    Sim.particles.push([
                        x, y, z,
                        
                        // velocity
                        10 * Math.sign(Math.random() - 0.5),
                        -v0 * Math.cos(t) * Math.sign(x) * Math.sin(phi),
                        -v0 * Math.cos(t) * Math.sign(x) * Math.cos(phi),

                        // Acceleration
                        0, 0, 0,

                        // Char
                        Math.floor(Math.random() * Sim.characters.length), 0
                    ]);
                }
            },

            reset: function() {
                Sim.particles = [];
                Sim.initParticles();
            },

            render: function(ctx) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
                ctx.fillRect(-canvas.width/2, -canvas.height/2, canvas.width, canvas.height);

                ctx.fillStyle = Sim.matrixColor;
                Sim.particles.forEach((p) => {
                    let dist_v = Math.sqrt(
                        Math.pow(p[0] - v[0], 2) +
                        Math.pow(p[1] - v[1], 2) +
                        Math.pow(p[2] - v[2], 2)
                    );

                    let dist_c = Math.sqrt(
                        Math.pow(p[0] - c[0], 2) +
                        Math.pow(p[1] - c[1], 2) +
                        Math.pow(p[2] - c[2], 2)
                    );

                    ctx.fillStyle = `hsl(${Math.floor((dist_c / 800) * 360) % 360}, 100%, 50%)`;
                    ctx.font = `${Math.floor(Sim.particleSize * vh / dist_v)}px sans-serif`;
                    
                    if (p[10] > 1) { 
                        p[10] = 0;
                        p[9] = Math.floor(Math.random() * Sim.characters.length)
                    }

                    ctx.fillText(
                        Sim.characters[p[9]],
                        (p[0] - v[0]) * vh / dist_v,
                        (p[1] - v[1]) * vh / dist_v
                    );

                    let accelMagnitude = G / Math.pow(dist_c + eps, 2);

                    p[6] = -accelMagnitude * (p[0] / dist_c);
                    p[7] = -accelMagnitude * (p[1] / dist_c);
                    p[8] = -accelMagnitude * (p[2] / dist_c);

                    p[3] += p[6] * dtime * timeMultiplier;
                    p[4] += p[7] * dtime * timeMultiplier;
                    p[5] += p[8] * dtime * timeMultiplier;

                    p[0] += p[3] * dtime * timeMultiplier;
                    p[1] += p[4] * dtime * timeMultiplier;
                    p[2] += p[5] * dtime * timeMultiplier;

                    p[10] += dtime * timeMultiplier;
                });
            }
        }

        function update_globals() {
            Sim.maxParticles = controls.querySelector("#particle-count").value;
            controls.querySelector("#np").innerHTML = Sim.maxParticles;

            G = controls.querySelector("#gravity").value;
            controls.querySelector("#g").innerHTML = G;

            timeMultiplier = controls.querySelector("#fps").value / 10;
            controls.querySelector("#_fps").innerHTML = timeMultiplier;
        }

        controls.onmousemove = update_globals;

        canvas.addEventListener("wheel", function(ev) {
            ev.preventDefault();

            if (ev.deltaY > 0) vh *= 0.9;
            if (ev.deltaY < 0) vh *= 1.1;
        });

        window.onload = function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            ctx.globalCompositeOperation = 'source-over';
            ctx.translate(canvas.width / 2, canvas.height / 2);

            dtime = 1.0 / Sim.FPS;
            v = [0, 0, 1000];

            update_globals();

            Sim.initParticles();
            Sim.render(ctx);

            if (!running) {
                ctx.fillStyle = "white";
                ctx.font = "20px monospace";
                ctx.textAlign = 'center';
                ctx.fillText("Click to start", 0, -100);
            } else {
                setInterval(Sim.render, Sim.FPS, ctx);
            }
        }
    </script>
</body>
</html>
